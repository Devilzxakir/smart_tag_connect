name: Mobile Android APK

# Builds an installable Android APK for the React Native app in `mobile/`.
#
# Why CI: the app needs the Android SDK + JDK, and prebuild generates the native
# project from app.json (Continuous Native Generation). Nothing native is
# committed, so this workflow is the single reproducible way to produce an APK.
#
# Credentials: the app needs the Supabase URL + *publishable* key at bundle
# time. Set the repository secrets
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# or leave them unset and the workflow falls back to the public values already
# committed in the web app's `.env`. The service-role key is never used here.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Gradle variant to build
        type: choice
        options: [release, debug]
        default: release
      architectures:
        description: Target ABIs (comma separated)
        type: string
        default: arm64-v8a,armeabi-v7a
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Write runtime configuration
        working-directory: mobile
        env:
          SUPABASE_URL_SECRET: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY_SECRET: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_APP_URL_SECRET: ${{ vars.EXPO_PUBLIC_PUBLIC_APP_URL }}
        run: |
          set -eu
          url="${SUPABASE_URL_SECRET:-}"
          key="${SUPABASE_KEY_SECRET:-}"
          origin="${PUBLIC_APP_URL_SECRET:-}"

          # Fall back to the public values the web app already ships with.
          if [ -z "$url" ] && [ -f ../.env ]; then
            url="$(grep -E '^VITE_SUPABASE_URL=' ../.env | head -1 | cut -d= -f2- || true)"
          fi
          if [ -z "$key" ] && [ -f ../.env ]; then
            key="$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' ../.env | head -1 | cut -d= -f2- || true)"
          fi

          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning::No Supabase credentials found. The APK will open on the 'Setup required' screen."
          fi

          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$url"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            if [ -n "$origin" ]; then echo "EXPO_PUBLIC_PUBLIC_APP_URL=$origin"; fi
            echo "EXPO_NO_TELEMETRY=1"
          } > .env

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build
        working-directory: mobile/android
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
          ARCHS: ${{ inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
        run: |
          set -eu
          task="assemble$(echo "${VARIANT}" | sed 's/./\U&/')"
          ./gradlew "${task}" -PreactNativeArchitectures="${ARCHS}" --no-daemon --stacktrace

      - name: Collect APK
        id: collect
        working-directory: mobile/android
        run: |
          set -eu
          variant="${{ inputs.variant || 'release' }}"
          apk="$(ls app/build/outputs/apk/${variant}/*.apk | head -1)"
          echo "path=${apk}" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$apk" "$GITHUB_WORKSPACE/artifacts/smart-tag-connect-${variant}.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-tag-connect-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
